name: Frontend Continuous Integration

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: ./starter/frontend
        run: npm install

      - name: Run lint
        working-directory: ./starter/frontend
        run: npm run lint || true

      - name: Run tests
        working-directory: ./starter/frontend
        run: CI=true npm test -- --watchAll=false

  build:
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t frontend:ci-test ./starter/frontend