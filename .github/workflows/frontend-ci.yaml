name: Frontend Continuous Integration

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'starter/frontend/**'
      - '.github/workflows/frontend-ci.yaml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./starter/frontend
        run: npm ci

      - name: Validate npm cache
        working-directory: ./starter/frontend
        run: npm cache verify

      - name: Run lint
        working-directory: ./starter/frontend
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./starter/frontend
        run: npm ci

      - name: Validate npm cache
        working-directory: ./starter/frontend
        run: npm cache verify

      - name: Run tests
        working-directory: ./starter/frontend
        run: CI=true npm test -- --watchAll=false

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./starter/frontend
        run: npm ci

      - name: Validate npm cache
        working-directory: ./starter/frontend
        run: npm cache verify

      - name: Build frontend application
        working-directory: ./starter/frontend
        run: npm run build

      - name: Build Docker image
        run: docker build -t frontend:ci-test ./starter/frontend